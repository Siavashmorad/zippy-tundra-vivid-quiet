name: Toranj Customer Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.customer.config.ts"
      - ".github/workflows/customer-apk.yml"
      - "firebase/customer/google-services.json"
      - "src/components/customer/**"
      - "src/lib/toranj/api/customer.ts"
      - "src/lib/toranj/api/push.ts"
      - "src/lib/toranj/server/**"
      - "src/lib/toranj/native-push.ts"
      - "src/components/native-push-bootstrap.tsx"
      - "src/routes/__root.tsx"
      - "src/routes/c.tsx"
      - "src/routes/customer-login.tsx"
      - "src/lib/auth/**"
      - "src/styles.css"
      - "assets/icons/toranj_customer.svg"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"

permissions:
  contents: read

jobs:
  customer-apk:
    name: Build مشتری ترنج APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Install Capacitor Android tooling
        run: npm install --no-save --no-audit --no-fund @capacitor/android@^7.4.4 @capacitor/cli@^7.4.4 @capacitor/assets@^3.0.5
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production web build
        env:
          VITE_AUTH_ENABLED: "true"
          VITE_TORANJ_APP_ROLE: "customer"
        run: ./node_modules/.bin/vite build
      - name: Check production backend
        run: |
          node -e "fetch('https://zippy-tundra-vivid-quiet.vercel.app/api/health').then(async r => { const t=await r.text(); console.log('health',r.status,t); if(r.status!==200) process.exit(1) }).catch(e => { console.error(e); process.exit(1) })"
      - name: Use customer Capacitor config
        run: cp capacitor.customer.config.ts capacitor.config.ts
      - name: Add Android platform
        run: npx cap add android
      - name: Prepare Capacitor Android assets directory
        run: mkdir -p android/app/src/main/assets
      - name: Install Firebase Android configuration
        run: |
          test -f firebase/customer/google-services.json
          mkdir -p android/app
          cp firebase/customer/google-services.json android/app/google-services.json
      - name: Generate Android assets
        run: |
          mkdir -p resources
          if command -v convert >/dev/null 2>&1 && [ -f assets/icons/toranj_customer.svg ]; then convert -background none assets/icons/toranj_customer.svg -resize 1024x1024 resources/icon.png || true; fi
          if [ -f resources/icon.png ]; then npx capacitor-assets generate --android || true; fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('android')
          build = root / 'build.gradle'
          if build.exists() and 'com.google.gms:google-services' not in build.read_text():
              text = build.read_text()
              if 'buildscript {' in text:
                  text = text.replace('buildscript {', 'buildscript {\n    dependencies { classpath "com.google.gms:google-services:4.4.2" }', 1)
                  build.write_text(text)
          app = root / 'app' / 'build.gradle'
          if app.exists() and 'com.google.gms.google-services' not in app.read_text():
              app.write_text(app.read_text() + '\napply plugin: "com.google.gms.google-services"\n')
          PY
      - name: Verify applicationId and Firebase package
        run: |
          grep -R -q 'ir.toranj.customer' android/app
          grep -q '"package_name": "ir.toranj.customer"' android/app/google-services.json
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify installable APK
        run: |
          mapfile -t apks < <(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          test "${#apks[@]}" -gt 0
          printf '%s\n' "${apks[@]}"
      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toranj-customer-installable-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
