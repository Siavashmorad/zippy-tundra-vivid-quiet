name: Toranj Seller Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"
      - "src/**"
      - "public/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "scripts/**"

permissions:
  contents: read

env:
  # The APK must use real Better Auth. The preview template keeps this false,
  # but the production Neon database must never be accessed with the shared
  # development user.
  VITE_AUTH_ENABLED: "true"

jobs:
  android-apk:
    name: Build فروشنده ترنج APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install project dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Install Capacitor tooling
        run: npm install --no-save --no-audit --no-fund @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/assets@latest

      - name: Web checks
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Check production backend
        continue-on-error: true
        run: |
          node -e "fetch('https://zippy-tundra-vivid-quiet.vercel.app/api/health').then(async r => { const t=await r.text(); console.log('health',r.status,t); if(r.status!==200) process.exit(1) }).catch(e => { console.error(e); process.exit(1) })"

      - name: Prepare Capacitor web directory
        run: mkdir -p dist

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icon assets
        run: |
          mkdir -p resources
          if [ -f public/icon-512.png ]; then
            cp public/icon-512.png resources/icon.png
          elif [ -f assets/icons/toranj_seller.svg ]; then
            cp assets/icons/toranj_seller.svg resources/icon.svg || true
          fi
          if [ -f resources/icon.png ]; then
            npx capacitor-assets generate --android || true
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toranj-seller-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
